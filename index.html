<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>危險實驗室：原理大揭秘 v2.2</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            touch-action: none;
        }

        h2 { margin: 10px 0; color: #f1c40f; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        #sim-container {
            position: relative;
            width: 95%;
            max-width: 600px;
            height: 400px;
            background: #34495e;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 4px solid #7f8c8d;
            overflow: hidden;
        }

        canvas { display: block; width: 100%; height: 100%; }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 95%;
            max-width: 600px;
            justify-content: center;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            color: white;
        }

        button:active { transform: translateY(3px); box-shadow: none; }

        #btn-safe { background-color: #2ecc71; } /* 綠色 */
        #btn-open { background-color: #f39c12; } /* 橙色 */
        #btn-short { background-color: #e74c3c; } /* 紅色 */

        #btn-short.active { animation: pulse-btn 1s infinite; }

        @keyframes pulse-btn { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* 溫度計 */
        #temp-container {
            position: absolute;
            right: 20px; top: 20px; width: 30px; height: 150px;
            background: #fff; border-radius: 15px; border: 2px solid #000; padding: 3px;
        }
        #temp-bar {
            width: 100%; height: 10%;
            background: linear-gradient(to top, #3498db, #f1c40f, #e74c3c);
            border-radius: 10px; position: absolute; bottom: 3px; left: 3px; width: calc(100% - 6px);
            transition: height 0.5s;
        }
        .temp-label { position: absolute; bottom: -25px; left: -10px; width: 60px; font-size: 0.8rem; text-align: center; color: white; font-weight: bold;}

        /* 警告紅光 */
        #warning-overlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(231, 76, 60, 0.4);
            z-index: 10; pointer-events: none;
            animation: flash 0.5s infinite;
        }
        @keyframes flash { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

        /* 狀態文字 */
        #status-text {
            position: absolute; top: 10px; left: 20px;
            font-size: 1.2rem; font-weight: bold; color: #2ecc71; text-shadow: 1px 1px 2px black;
        }

        /* NEW: 解釋框 (Explanation Box) */
        #explain-box {
            display: none;
            position: absolute;
            bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #f1c40f;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: bold;
            border: 2px solid #f1c40f;
            text-align: center;
            width: 80%;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h2>⚡ 電路實驗室：原理大揭秘 ⚡</h2>

    <div id="sim-container">
        <canvas id="simCanvas"></canvas>
        
        <div id="status-text">狀態：閉合電路 (正常)</div>
        
        <div id="temp-container">
            <div id="temp-bar"></div>
            <div class="temp-label">溫度計</div>
        </div>
        
        <div id="warning-overlay"></div>

        <!-- 解釋框 -->
        <div id="explain-box">
            💡 電流特性：<br>電流像懶惰的人，會自動選擇<br>「阻力最小的捷徑」通過！
        </div>
    </div>

    <div class="controls">
        <button id="btn-safe" onclick="setMode('safe')">⭕ 閉合電路 (亮)</button>
        <button id="btn-open" onclick="setMode('open')">❌ 斷路 (不亮)</button>
        <button id="btn-short" onclick="setMode('short')">🚨 短路 (危險)</button>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 600;
        canvas.height = 400;

        let mode = 'safe'; 
        let temperature = 10;
        let particles = [];
        let sparks = [];
        let shakeOffset = { x: 0, y: 0 };
        
        // 座標定義
        const batteryPos = { x: 80, y: 150, w: 60, h: 100 };
        const wireStart = { x: 110, y: 140 }; // 電池正極
        const wireEnd = { x: 110, y: 255 };   // 電池負極
        const bulbPos = { x: 480, y: 197 };   
        const bulbWireTop = { x: 480, y: 140 };
        const bulbWireBot = { x: 480, y: 255 };
        const shortX = 300; 

        // 路徑長度
        const PATH_LEN_SAFE = 970;
        const PATH_LEN_SHORT = 610;
        
        const PARTICLE_COUNT = 45; 

        // 初始化粒子 (確保間距一致)
        function initParticles(targetMode) {
            particles = [];
            let totalLen = (targetMode === 'short') ? PATH_LEN_SHORT : PATH_LEN_SAFE;
            let spacing = totalLen / PARTICLE_COUNT;
            
            for(let i=0; i < PARTICLE_COUNT; i++) {
                particles.push({
                    dist: i * spacing, // 均勻分佈
                    // Fix 1: 調整短路速度由 25 -> 10，避免頻閃錯覺，看起來更流暢
                    speed: (targetMode === 'short') ? 10 : 3 
                });
            }
        }

        initParticles('safe');

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updatePhysics();

            if(mode === 'short' && temperature > 50) {
                shakeOffset.x = (Math.random() - 0.5) * 5;
                shakeOffset.y = (Math.random() - 0.5) * 5;
            } else {
                shakeOffset = {x:0, y:0};
            }

            ctx.save();
            ctx.translate(shakeOffset.x, shakeOffset.y);

            drawWires();
            drawBattery();
            drawBulb();
            drawSwitch();
            drawParticles();
            drawSparks();

            ctx.restore();

            if(mode === 'short' && temperature > 80) {
                drawWarningText();
            }
            requestAnimationFrame(animate);
        }

        function updatePhysics() {
            // 溫度
            if(mode === 'short') { 
                if(temperature < 100) temperature += 0.5; 
            } else { 
                if(temperature > 10) temperature -= 1; 
            }
            
            document.getElementById('temp-bar').style.height = temperature + '%';
            document.getElementById('warning-overlay').style.display = (temperature > 85) ? 'block' : 'none';

            let targetSpeed = 0;
            let maxDist = PATH_LEN_SAFE; 

            if(mode === 'safe') {
                targetSpeed = 3; 
                maxDist = PATH_LEN_SAFE;
            } else if (mode === 'short') {
                targetSpeed = 10; // Fix 1: 降低最大速度，防止視覺上看起來靜止
                maxDist = PATH_LEN_SHORT;
            } else {
                targetSpeed = 0;
                maxDist = PATH_LEN_SAFE;
            }

            particles.forEach(p => {
                p.speed += (targetSpeed - p.speed) * 0.1;
                p.dist += p.speed;
                if(p.dist > maxDist) p.dist = 0;
            });

            if(temperature > 80 && Math.random() > 0.6) createSpark();
            updateSparks();
        }

        function drawWires() {
            // 電線變色邏輯 (藍 -> 紅 -> 白)
            let r = 52 + (temperature * 2);
            let g = 152 - (temperature * 1.5);
            let b = 219 - (temperature * 2);
            
            // Fix 2: 限制最亮顏色為淺粉紅，不要純白，避免與白色粒子混淆
            // 但如果粒子改了顏色，這裡可以保持白熱化
            if(temperature > 90) { r=255; g=200; b=200; } 
            
            ctx.strokeStyle = `rgb(${r},${g},${b})`;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            ctx.shadowBlur = (temperature > 50) ? temperature / 2 : 0;
            ctx.shadowColor = 'orange';

            ctx.beginPath();
            
            // Top Wire
            ctx.moveTo(wireStart.x, wireStart.y);
            if(mode === 'open') {
                ctx.lineTo(200, wireStart.y); 
                ctx.moveTo(240, wireStart.y - 20); 
                ctx.lineTo(bulbWireTop.x, wireStart.y); 
            } else {
                ctx.lineTo(bulbWireTop.x, wireStart.y);
            }

            // Bulb
            ctx.lineTo(bulbWireBot.x, bulbWireBot.y); 

            // Bottom Wire
            ctx.lineTo(wireEnd.x, wireEnd.y);
            ctx.lineTo(wireStart.x, wireEnd.y); 

            // Short Bridge
            if(mode === 'short') {
                ctx.moveTo(shortX, wireStart.y);
                ctx.lineTo(shortX, wireEnd.y);
                ctx.lineWidth = 12;
            }

            ctx.stroke();
            ctx.shadowBlur = 0; 
            ctx.lineWidth = 8; 
        }

        function drawSwitch() {
            if(mode !== 'open') return;
            ctx.fillStyle = '#7f8c8d';
            ctx.fillRect(190, wireStart.y - 5, 60, 10);
        }

        function drawBattery() {
            const x = batteryPos.x;
            const y = batteryPos.y;
            const w = batteryPos.w;
            const h = batteryPos.h;

            ctx.shadowBlur = 10;
            ctx.shadowColor = "rgba(0,0,0,0.5)";

            // 漸變色電池
            const gradBody = ctx.createLinearGradient(x, y, x + w, y);
            gradBody.addColorStop(0, "#2c3e50"); gradBody.addColorStop(0.5, "#4ca1af"); gradBody.addColorStop(1, "#2c3e50");
            
            const gradGold = ctx.createLinearGradient(x, y, x+w, y);
            gradGold.addColorStop(0, "#f1c40f"); gradGold.addColorStop(0.5, "#fceabb"); gradGold.addColorStop(1, "#f1c40f");
            
            const gradBlack = ctx.createLinearGradient(x, y, x+w, y);
            gradBlack.addColorStop(0, "#000"); gradBlack.addColorStop(0.5, "#434343"); gradBlack.addColorStop(1, "#000");

            ctx.fillStyle = gradGold; ctx.fillRect(x, y, w, h * 0.3);
            ctx.fillStyle = gradBlack; ctx.fillRect(x, y + h * 0.3, w, h * 0.7);

            ctx.fillStyle = "#d35400"; ctx.fillRect(x + w/4, y - 10, w/2, 10); // +
            ctx.fillStyle = "#bdc3c7"; ctx.fillRect(x + 5, y + h, w - 10, 5);  // -

            ctx.shadowBlur = 0;

            ctx.fillStyle = "#d35400"; ctx.font = "bold 24px Arial"; ctx.fillText("+", x + w + 10, y + 25);
            ctx.fillStyle = "#bdc3c7"; ctx.fillText("-", x + w + 10, y + h - 5);
            
            if(temperature > 90) {
                ctx.fillStyle = 'rgba(255, 0, 0, 0.4)'; ctx.fillRect(x, y-10, w, h+15);
            }
        }

        function drawBulb() {
            const lx = bulbPos.x;
            const ly = bulbPos.y;

            ctx.fillStyle = '#7f8c8d'; ctx.fillRect(lx - 15, ly + 25, 30, 20);
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(lx - 10, ly + 45, 20, 10);

            ctx.beginPath();
            ctx.arc(lx, ly, 30, 0, Math.PI*2);
            
            if(mode === 'safe') {
                ctx.fillStyle = '#f1c40f';
                ctx.shadowBlur = 30; ctx.shadowColor = 'rgba(241, 196, 15, 0.8)';
            } else {
                ctx.fillStyle = '#bdc3c7'; 
                ctx.shadowBlur = 0;
            }
            ctx.fill();
            ctx.shadowBlur = 0;
            
            ctx.beginPath();
            ctx.strokeStyle = (mode === 'safe') ? '#fff' : '#555';
            ctx.lineWidth = 2;
            ctx.moveTo(lx, ly - 30); ctx.lineTo(lx - 10, ly); ctx.lineTo(lx + 10, ly); ctx.lineTo(lx, ly + 25);
            ctx.stroke();
        }

        function getPositionAtDist(d) {
            if(mode === 'short') {
                if (d < 190) return { x: wireStart.x + d, y: wireStart.y }; 
                if (d < 305) return { x: shortX, y: wireStart.y + (d - 190) }; 
                if (d < 495) return { x: shortX - (d - 305), y: wireEnd.y }; 
                return { x: wireEnd.x, y: wireEnd.y - (d - 495) }; 
            } 
            else {
                if (d < 370) return { x: wireStart.x + d, y: wireStart.y }; 
                if (d < 485) return { x: bulbWireTop.x, y: bulbWireTop.y + (d - 370) }; 
                if (d < 855) return { x: bulbWireBot.x - (d - 485), y: bulbWireBot.y }; 
                return { x: wireEnd.x, y: wireEnd.y - (d - 855) }; 
            }
        }

        function drawParticles() {
            if(mode === 'open') return;

            particles.forEach(p => {
                const pos = getPositionAtDist(p.dist);
                if(pos.x === wireEnd.x && pos.y > wireStart.y && pos.y < wireEnd.y) return;

                ctx.beginPath();
                ctx.arc(pos.x, pos.y, 6, 0, Math.PI*2);
                
                // Fix 2: 短路時使用深紅色粒子 (e74c3c)，確保在白熱化電線上依然可見
                // 正常時使用橙色 (e67e22)
                ctx.fillStyle = (mode === 'short') ? '#c0392b' : '#e67e22'; 
                ctx.fill();
            });
        }

        function createSpark() {
            sparks.push({
                x: shortX + (Math.random()-0.5)*20, 
                y: 140 + Math.random() * 115,
                vx: (Math.random() - 0.5) * 5,
                vy: (Math.random() - 2) * 5,
                life: 1.0
            });
        }

        function updateSparks() {
            for(let i=sparks.length-1; i>=0; i--) {
                let s = sparks[i];
                s.x += s.vx; s.y += s.vy; s.life -= 0.05;
                if(s.life <= 0) sparks.splice(i, 1);
            }
        }

        function drawSparks() {
            sparks.forEach(s => {
                ctx.globalAlpha = s.life;
                ctx.fillStyle = `rgb(255, ${Math.floor(s.life * 200)}, 0)`;
                ctx.beginPath(); ctx.arc(s.x, s.y, 5 * s.life, 0, Math.PI*2); ctx.fill();
                ctx.globalAlpha = 1.0;
            });
        }

        function drawWarningText() {
            ctx.save();
            ctx.font = 'bold 60px Arial';
            ctx.fillStyle = 'red';
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 5;
            ctx.textAlign = 'center';
            ctx.translate(300, 200);
            ctx.rotate((Math.random()-0.5)*0.1);
            ctx.strokeText("⚠️ 危險！短路！", 0, 0);
            ctx.fillText("⚠️ 危險！短路！", 0, 0);
            ctx.restore();
        }

        function setMode(m) {
            mode = m;
            const status = document.getElementById('status-text');
            const box = document.getElementById('explain-box'); // 提示框
            const btns = document.querySelectorAll('button');
            btns.forEach(b => b.classList.remove('active'));

            if(m === 'safe') {
                status.innerText = "狀態：閉合電路 (正常)";
                status.style.color = "#2ecc71";
                box.style.display = 'none'; // 隱藏提示
                initParticles('safe');
            } else if (m === 'open') {
                status.innerText = "狀態：斷路 (缺口)";
                status.style.color = "#f39c12";
                box.style.display = 'none'; // 隱藏提示
            } else {
                status.innerText = "狀態：短路 (危險！)";
                status.style.color = "#e74c3c";
                document.getElementById('btn-short').classList.add('active');
                box.style.display = 'block'; // 顯示提示 (New!)
                if(navigator.vibrate) navigator.vibrate([500, 200, 500]);
                initParticles('short');
            }
        }

        animate();
    </script>
</body>
</html>
